x-build: &build
  context: .
  dockerfile: deploy/Dockerfile

x-mcp: &mcp
  restart: unless-stopped
  volumes:
    - ./examples/docs-assistant/config:/app/config:ro
  environment: &mcp-env
    PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set in .env}
    JWT_ISSUER: agentic-platform
    POLICY_FILE: /app/config/policies.yaml
    RUST_LOG: ${RUST_LOG:-info}
    LOG_FORMAT: json

services:
  gateway:
    build:
      <<: *build
      args: { WORKSPACE: ".", BIN: docs-assistant, CARGO_FEATURES: "${CARGO_FEATURES:-}" }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      PLATFORM_CONFIG: /app/config/platform.yaml
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set in .env}
      AGENT_ENGINE: ${AGENT_ENGINE:-rig}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ollama:gpt-oss}
      COORDINATOR_MODEL: ${COORDINATOR_MODEL:-ollama:gpt-oss}
      # Set to http://ollama:11434 when using the `ollama` profile.
      OLLAMA_API_BASE_URL: ${OLLAMA_API_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DOCS_MCP_URL: http://docs-mcp:3001/mcp
      TICKETS_MCP_URL: http://tickets-mcp:3002/mcp
      PROMPT_STATE_FILE: /data/prompt-state.json
      LOG_FORMAT: json
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./examples/docs-assistant/config:/app/config:ro
      - gateway-data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      docs-mcp: { condition: service_healthy }
      tickets-mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  docs-mcp:
    <<: *mcp
    build:
      <<: *build
      args: { WORKSPACE: mcp, BIN: docs-mcp }
    expose: ["3001"]
    environment:
      <<: *mcp-env
      MCP_SERVER_NAME: docs
      MCP_LISTEN: 0.0.0.0:3001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  tickets-mcp:
    <<: *mcp
    build:
      <<: *build
      args: { WORKSPACE: mcp, BIN: tickets-mcp }
    expose: ["3002"]
    environment:
      <<: *mcp-env
      MCP_SERVER_NAME: tickets
      MCP_LISTEN: 0.0.0.0:3002
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    restart: unless-stopped
    expose: ["11434"]
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  gateway-data:
  prometheus-data:
  grafana-data:
  ollama-data:
