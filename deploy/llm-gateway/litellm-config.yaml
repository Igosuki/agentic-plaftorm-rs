model_list:
  # `ollama_chat/` (not `ollama/`) uses Ollama's /api/chat, which supports tool calls.
  - model_name: default
    litellm_params:
      model: ollama_chat/gpt-oss
      api_base: http://host.docker.internal:11434
  - model_name: docs-default
    litellm_params:
      model: ollama_chat/gpt-oss
      api_base: http://host.docker.internal:11434

  # - model_name: openai-mini
  #   litellm_params:
  #     model: openai/gpt-4.1-mini
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: claude
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  # The platform guard owns retries (bounded attempts, token budget, per-attempt telemetry); retries here would multiply them.
  num_retries: 0
  # Shared across LiteLLM replicas: rate-limit counters, deployment cooldowns, cache.
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # Used on failure of the primary alias; the platform sees one attempt.
  # fallbacks: [{"default": ["openai-mini"]}]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Seconds between spend-log flushes to Postgres.
  proxy_batch_write_at: 10
