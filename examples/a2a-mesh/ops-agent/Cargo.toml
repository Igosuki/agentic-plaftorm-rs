[workspace]

[package]
name = "ops-agent"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ops_agent"
path = "src/lib.rs"

[[bin]]
name = "ops-agent"
path = "src/main.rs"

[dependencies]
adk-core = "=2.2.0"
adk-agent = "=2.2.0"
adk-model = { version = "=2.2.0", default-features = false, features = ["ollama", "openai", "anthropic", "gemini"] }
adk-session = "=2.2.0"
adk-runner = "=2.2.0"
adk-server = { version = "=2.2.0", features = ["a2a-v1"] }
a2a-protocol-types = "0.5"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
a2a-rs = { version = "=0.10.0", default-features = false, features = ["jsonrpc-server", "jsonrpc-client"] }
buffa-types = { version = "0.9.2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tower = { version = "0.5", features = ["util"] }
