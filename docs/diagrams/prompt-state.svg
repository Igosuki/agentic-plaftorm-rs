<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prompt-state-title prompt-state-desc" id="prompt-state-root">
        <title id="prompt-state-title">Prompt live-pointer state</title>
        <desc id="prompt-state-desc">State machine of a prompt's live pointer: it starts at the YAML live version, API posts move it to a runtime override or roll it back, and a changed YAML live drops the override; every override change is persisted atomically.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #prompt-state-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #prompt-state-root { font-family: var(--font-sans); color: var(--color-ink); }
      #prompt-state-root .diagram-container { width: 100%; overflow-x: auto; }
      #prompt-state-root .diagram-container { overflow-x: visible; }</style>
          <marker id="prompt-state-prompt-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="prompt-state-prompt-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="prompt-state-prompt-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <circle cx="168" cy="128" r="6" fill="#2d3142"/>
        <path d="M168 134 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#prompt-state-prompt-state-arrow)"/>
        <rect x="176" y="156" width="116" height="12" rx="2" fill="#f5f5f5"/><text x="234.0" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">load, no override</text>
        <path d="M248 224 H560" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#prompt-state-prompt-state-arrow-link)"/>
        <rect x="340" y="204" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="213" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST live {version}</text>
        <path d="M560 264 H248" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#prompt-state-prompt-state-arrow)"/>
        <rect x="292" y="272" width="224" height="12" rx="2" fill="#f5f5f5"/><text x="404" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">YAML live changed since the override</text>
        <path d="M620 200 V168 a8 8 0 0 1 8 -8 H652 a8 8 0 0 1 8 8 V200" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#prompt-state-prompt-state-arrow-link)"/>
        <rect x="524" y="140" width="232" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="149" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST live, previous pushed to history</text>
        <path d="M660 288 V320 a8 8 0 0 1 -8 8 H628 a8 8 0 0 1 -8 -8 V288" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#prompt-state-prompt-state-arrow-link)"/>
        <rect x="556" y="336" width="168" height="12" rx="2" fill="#f5f5f5"/><text x="640" y="345" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST rollback, pop history</text>
        <text x="920" y="392" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end" font-style="italic">persisted to prompt_state_file:</text>
        <text x="920" y="412" fill="#2d3142" font-size="14" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end" font-style="italic">temp file, fsync, rename, fsync dir</text>
        <path d="M820 380 Q780 330 724 276" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/><circle cx="722" cy="274" r="2" fill="#2d3142"/>
        <rect x="88" y="200" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="200" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="168.0" y="240" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">YamlLive</text>
        <text x="168.0" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">live from YAML</text>
        <rect x="560" y="200" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="200" width="160" height="88" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="640.0" y="240" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Override</text>
        <text x="640.0" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runtime live + history</text>
        <line x1="40" y1="464" x2="920" y2="464" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
        <line x1="40" y1="500" x2="68" y2="500" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#prompt-state-prompt-state-arrow-link)"/>
        <text x="78" y="503" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">API request</text>
        <line x1="200" y1="500" x2="228" y2="500" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#prompt-state-prompt-state-arrow)"/>
        <text x="238" y="503" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Automatic, on load</text>
        <circle cx="400" cy="500" r="5" fill="#2d3142"/>
        <text x="412" y="503" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Start</text>
      </svg>
