<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1048" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="a2a-call-title a2a-call-desc" id="a2a-call-root">
        <title id="a2a-call-title">Remote A2A call</title>
        <desc id="a2a-call-desc">Sequence of one remote A2A call: the caller's guard asks A2aEngine, which mints a downscoped JWT and sends the message; the peer authenticates, checks ownership, runs its pipeline and returns a completed task that the guard validates locally.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #a2a-call-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #a2a-call-root { font-family: var(--font-sans); color: var(--color-ink); }
      #a2a-call-root .diagram-container { width: 100%; overflow-x: auto; }
      #a2a-call-root .diagram-container { overflow-x: visible; }</style>
