        <title id="a2a-mesh-title">A2A mesh topology</title>
        <desc id="a2a-mesh-desc">Client calls three agents in the mesh-gateway; docs_agent uses an MCP server, while ops_agent and math_agent reach peer A2A services, and three of the services call Ollama.</desc>
