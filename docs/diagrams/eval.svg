<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eval-title eval-desc" id="eval-root">
        <title id="eval-title">Candidate-prompt gate</title>
        <desc id="eval-desc">Sequence of the agentic-eval candidate-prompt gate: set the candidate live, score each golden case against the gateway, restore the previous version, then exit 0, 1 or 2.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #eval-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #eval-root { font-family: var(--font-sans); color: var(--color-ink); }
      #eval-root .diagram-container { width: 100%; overflow-x: auto; }
      #eval-root .diagram-container { overflow-x: visible; }</style>
          <marker id="eval-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="eval-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="eval-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="eval-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#eval-dots)" opacity="0.55"/> -->

<rect x="152" y="208" width="656" height="244" rx="4" fill="#f1f1f1" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
<rect x="152" y="208" width="44" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/><text x="174" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
<text x="212" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[each golden case, runs times]</text>
<line x1="200" y1="68" x2="200" y2="584" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
<line x1="760" y1="68" x2="760" y2="584" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
<line x1="200" y1="124" x2="760" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<rect x="330" y="102" width="300" height="14" rx="2" fill="#f5f5f5"/><text x="480" y="112" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GET /admin/prompts, remember each live version</text>
<line x1="200" y1="176" x2="760" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<rect x="274" y="154" width="412" height="14" rx="2" fill="#f5f5f5"/><text x="480" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /admin/prompts/{id}/live {candidate, record_history: false}</text>
<line x1="200" y1="284" x2="760" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<rect x="370" y="262" width="220" height="14" rx="2" fill="#f1f1f1"/><text x="480" y="272" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /auth/token as the case user</text>
<line x1="200" y1="328" x2="760" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<rect x="414" y="306" width="132" height="14" rx="2" fill="#f1f1f1"/><text x="480" y="316" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /v1/agents/run</text>
<line x1="760" y1="372" x2="200" y2="372" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#eval-arrow-accent)"/>
<rect x="342" y="350" width="276" height="14" rx="2" fill="#f1f1f1"/><text x="480" y="360" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">output and trace: agent, tool_calls, usage</text>
<path d="M200,404 H216 A8,8 0 0 1 224,412 V416 A8,8 0 0 1 216,424 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<text x="240" y="417" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">score routing, trajectory, response</text>
<line x1="200" y1="496" x2="760" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<rect x="276" y="474" width="408" height="14" rx="2" fill="#f5f5f5"/><text x="480" y="484" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /admin/prompts/{id}/live {previous, record_history: false}</text>
<path d="M200,540 H216 A8,8 0 0 1 224,548 V552 A8,8 0 0 1 216,560 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eval-arrow)"/>
<text x="240" y="553" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">averages vs thresholds: exit 0 pass, 1 miss, 2 infra error</text>
<rect x="120" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
<rect x="120" y="24" width="160" height="44" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
<text x="200" y="42.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">agentic-eval</text>
<text x="200" y="57.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CI</text>
<rect x="680" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
<rect x="680" y="24" width="160" height="44" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="760" y="50" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gateway</text>

      </svg>
