<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 960 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-title build-desc" id="build-root">
        <title id="build-title">Docker build paths</title>
        <desc id="build-desc">Two build paths from repo source to one runtime stage: make up compiles inside Docker, make up-prebuilt compiles on the host and packages the binary.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #build-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #build-root { font-family: var(--font-sans); color: var(--color-ink); }
      #build-root .diagram-container { width: 100%; overflow-x: auto; }
      #build-root .diagram-container { overflow-x: visible; }</style>
          <marker id="build-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="build-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="build-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="build-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect x="0" y="64" width="960" height="280" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#build-dots)" opacity="0.55"/> -->

<path d="M216,138 L640,138" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#build-arrow)"/>
<rect x="402" y="114" width="52" height="14" rx="2" fill="#f5f5f5"/><text x="428" y="124" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MAKE UP</text>
<text x="428" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stage builder,</text>
<text x="428" y="177" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cargo build --release in Docker</text>
<path d="M128,166 L128,270 A8,8 0 0 0 136,278 L340,278" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#build-arrow)"/>
<rect x="194" y="254" width="80" height="14" rx="2" fill="#f5f5f5"/><text x="234" y="264" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UP-PREBUILT</text>
<text x="234" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">make up-prebuilt:</text>
<text x="234" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cargo build on the host</text>
<path d="M500,278 L772,278 A8,8 0 0 0 780,270 L780,188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#build-arrow)"/>
<rect x="592" y="254" width="96" height="14" rx="2" fill="#f5f5f5"/><text x="640" y="264" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STAGE PREBUILT</text>
<rect x="40" y="110" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="40" y="110" width="176" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
<text x="128" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">repo source</text>
<rect x="340" y="250" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="340" y="250" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="420" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">deploy/prebuilt/BIN</text>
<rect x="640" y="88" width="280" height="100" rx="6" fill="#f5f5f5"/>
<rect x="640" y="88" width="280" height="100" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="780" y="121.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">runtime stage</text>
<text x="780" y="136.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">base: debian:trixie-slim</text>
<text x="780" y="149.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">non-root user</text>
<text x="780" y="162.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/data</text>

      </svg>
