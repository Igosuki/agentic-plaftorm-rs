<svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-gateway-title ai-gateway-desc" id="ai-gateway-root">
        <title id="ai-gateway-title">AI gateway tier</title>
        <desc id="ai-gateway-desc">Three apps send model calls through one load balancer to stateless LiteLLM replicas, which share Postgres and Redis and reach Ollama GPU nodes and hosted providers.</desc>
