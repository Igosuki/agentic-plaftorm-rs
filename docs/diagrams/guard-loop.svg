<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guard-loop-title guard-loop-desc" id="guard-loop-root">
        <title id="guard-loop-title">Guard attempt loop</title>
        <desc id="guard-loop-desc">State machine of one guard attempt: an engine result is validated or classified as a schema violation, hallucination, max turns, infrastructure error, or remote rejection; retryable classes pass a budget choice back to a new attempt, otherwise the run fails with 502 agent_failed.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #guard-loop-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #guard-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #guard-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #guard-loop-root .diagram-container { overflow-x: visible; }</style>
