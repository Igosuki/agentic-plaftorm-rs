<svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compose-title compose-desc" id="compose-root">
        <title id="compose-title">docs-assistant compose stack</title>
        <desc id="compose-desc">Deployment of the docs-assistant compose stack: a host running Ollama and a compose network of gateway, MCP servers, Prometheus, Grafana and a state volume.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #compose-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #compose-root { font-family: var(--font-sans); color: var(--color-ink); }
      #compose-root .diagram-container { width: 100%; overflow-x: auto; }
      #compose-root .diagram-container { overflow-x: visible; }</style>
