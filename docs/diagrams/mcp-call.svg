<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1124" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-call-title mcp-call-desc" id="mcp-call-root">
        <title id="mcp-call-title">MCP tool call: token, policy, result</title>
        <desc id="mcp-call-desc">Sequence diagram of an engine tool call passing through McpHub, JWT authentication and policy middleware to the tool handler, with 401 and policy_denied branches, ending with a text result that never fails the run.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #mcp-call-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #mcp-call-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mcp-call-root .diagram-container { width: 100%; overflow-x: auto; }
      #mcp-call-root .diagram-container { overflow-x: visible; }</style>
