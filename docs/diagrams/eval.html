<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate-prompt gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Evaluation scoring</p>
    <h1>Candidate-prompt gate</h1>

    <!-- Replace eval with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eval-title eval-desc">
        <title id="eval-title">Candidate-prompt gate</title>
        <desc id="eval-desc">Sequence of the agentic-eval candidate-prompt gate: set the candidate live, score each golden case against the gateway, restore the previous version, then exit 0, 1 or 2.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

<rect x="152" y="208" width="656" height="244" rx="4" fill="#f1f1f1" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<rect x="152" y="208" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="174" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
<text x="212" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[each golden case, runs times]</text>
<line x1="200" y1="68" x2="200" y2="584" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="760" y1="68" x2="760" y2="584" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="200" y1="124" x2="760" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="102" width="300" height="14" rx="2" fill="#f5f5f5"/><text x="480" y="112" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GET /admin/prompts, remember each live version</text>
<line x1="200" y1="176" x2="760" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="274" y="154" width="412" height="14" rx="2" fill="#f5f5f5"/><text x="480" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /admin/prompts/{id}/live {candidate, record_history: false}</text>
<line x1="200" y1="284" x2="760" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="370" y="262" width="220" height="14" rx="2" fill="#f1f1f1"/><text x="480" y="272" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /auth/token as the case user</text>
<line x1="200" y1="328" x2="760" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="414" y="306" width="132" height="14" rx="2" fill="#f1f1f1"/><text x="480" y="316" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /v1/agents/run</text>
<line x1="760" y1="372" x2="200" y2="372" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
<rect x="342" y="350" width="276" height="14" rx="2" fill="#f1f1f1"/><text x="480" y="360" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">output and trace: agent, tool_calls, usage</text>
<path d="M200,404 H216 A8,8 0 0 1 224,412 V416 A8,8 0 0 1 216,424 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="240" y="417" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">score routing, trajectory, response</text>
<line x1="200" y1="496" x2="760" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="276" y="474" width="408" height="14" rx="2" fill="#f5f5f5"/><text x="480" y="484" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">POST /admin/prompts/{id}/live {previous, record_history: false}</text>
<path d="M200,540 H216 A8,8 0 0 1 224,548 V552 A8,8 0 0 1 216,560 H200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="240" y="553" fill="#2d3142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">averages vs thresholds: exit 0 pass, 1 miss, 2 infra error</text>
<rect x="120" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
<rect x="120" y="24" width="160" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
<text x="200" y="42.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">agentic-eval</text>
<text x="200" y="57.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CI</text>
<rect x="680" y="24" width="160" height="44" rx="6" fill="#f5f5f5"/>
<rect x="680" y="24" width="160" height="44" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="760" y="50" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gateway</text>

      </svg>
    </div>
  </div>
</body>
</html>
