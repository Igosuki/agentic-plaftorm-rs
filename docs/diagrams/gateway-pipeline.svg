<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gateway-pipeline-title gateway-pipeline-desc" id="gateway-pipeline-root">
        <title id="gateway-pipeline-title">Gateway request pipeline</title>
        <desc id="gateway-pipeline-desc">Flowchart of the gateway: auth, an intent gate that routes classified requests to the guard and unclassified ones to a coordinator LLM fallback or a 422, the guard drawing live prompts from the registry, running the AgentEngine and emitting telemetry.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #gateway-pipeline-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #gateway-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #gateway-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #gateway-pipeline-root .diagram-container { overflow-x: visible; }</style>
