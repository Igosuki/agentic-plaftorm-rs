<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engines-title engines-desc" id="engines-root">
        <title id="engines-title">Agent engines</title>
        <desc id="engines-desc">UML class diagram of the AgentEngine trait realized by the rig, adk and a2a engines, the TurnRequest, ToolSpec and TurnError types it exchanges, and the Guard, Coordinator and McpHub that use them.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #engines-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #engines-root { font-family: var(--font-sans); color: var(--color-ink); }
      #engines-root .diagram-container { width: 100%; overflow-x: auto; }
      #engines-root .diagram-container { overflow-x: visible; }</style>
