<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="telemetry-title telemetry-desc" id="telemetry-root">
        <title id="telemetry-title">Telemetry flow</title>
        <desc id="telemetry-desc">Data flow of one request through the pipeline into a Prometheus recorder without user labels, an in-memory metrics store with user and team metrics, and JSON tracing logs, then out to the metrics endpoint, Prometheus, Grafana and the metrics APIs.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #telemetry-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #telemetry-root { font-family: var(--font-sans); color: var(--color-ink); }
      #telemetry-root .diagram-container { width: 100%; overflow-x: auto; }
      #telemetry-root .diagram-container { overflow-x: visible; }</style>
          <marker id="telemetry-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="telemetry-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="telemetry-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

  
