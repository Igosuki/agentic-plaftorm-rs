# Separate workspace: fastmcp-rust runs on asupersync and pins serde_json with
# `arbitrary_precision`, which must not unify into the tokio/rig workspace.
[workspace]
resolver = "3"
members = [
    "agentic-mcp",
    "servers/docs-mcp",
    "servers/tickets-mcp",
    "servers/calc-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
agentic-core = { path = "../crates/agentic-core" }
agentic-mcp = { path = "agentic-mcp" }
fastmcp-rust = "=0.11.0"
asupersync = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
